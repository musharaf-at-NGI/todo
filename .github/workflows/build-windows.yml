name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyinstaller supabase

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "TodoApp" todo.py

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Auto-built from the latest commit on main.

            **Download:** click `TodoApp.exe` below.
            On first run, Windows may show a SmartScreen warning — click **More info → Run anyway**.
          files: dist/TodoApp.exe
          prerelease: false
